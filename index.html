<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRON AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0a0a0f;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 800px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #252535;
      background: #101018;
    }

    header h1 {
      color: #00eaff;
      font-size: 28px;
      text-shadow: 0 0 15px #00eaff;
    }

    header p {
      color: #999;
      margin-top: 5px;
      font-size: 13px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #0066ff;
      margin-left: auto;
    }

    .ai {
      background: #191923;
      border: 1px solid #30303d;
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #101018;
      border-top: 1px solid #252535;
    }

    #question {
      flex: 1;
      padding: 14px;
      border: 1px solid #333344;
      border-radius: 25px;
      outline: none;
      background: #191923;
      color: white;
      font-size: 16px;
    }

    #send {
      width: 55px;
      height: 55px;
      border: none;
      border-radius: 50%;
      background: #00eaff;
      color: black;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>🤖 ULTRON AI</h1>
      <p>Advanced AI Assistant</p>
    </header>

    <div id="chat">
      <div class="message ai">
        Hello! I am ULTRON AI 🤖. How can I help you today?
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="question"
        placeholder="Ask ULTRON anything..."
      >

      <button id="send">➤</button>
    </div>

  </div>

  <script>
    const questionInput = document.getElementById("question");
    const sendButton = document.getElementById("send");
    const chat = document.getElementById("chat");

    const API_URL = "https://ultron-3.onrender.com/ask";

    function addMessage(text, type) {
      const message = document.createElement("div");

      message.className = "message " + type;
      message.textContent = text;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;

      return message;
    }

    async function askUltron() {

      const question = questionInput.value.trim();

      if (!question) return;

      addMessage(question, "user");

      questionInput.value = "";

      sendButton.disabled = true;

      const aiMessage = addMessage(
        "ULTRON is thinking... 🤖",
        "ai"
      );

      try {

        const response = await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            question: question
          })

        });

        if (!response.ok) {
          throw new Error("Server error: " + response.status);
        }

        const data = await response.json();

        aiMessage.textContent =
          data.answer ||
          data.response ||
          data.message ||
          "ULTRON returned no answer.";

      } catch (error) {

        console.error(error);

        aiMessage.textContent =
          "❌ Couldn't connect to ULTRON AI.";

      }

      sendButton.disabled = false;

      questionInput.focus();
    }

    sendButton.addEventListener(
      "click",
      askUltron
    );

    questionInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          askUltron();
        }

      }
    );
  </script>

</body>
</html>
