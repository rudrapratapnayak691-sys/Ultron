<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ULTRON AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #172b9c, #3159f5);
      min-height: 100vh;
      color: white;
    }

    header {
      height: 85px;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    header h1 {
      font-size: 30px;
    }

    .menu {
      font-size: 35px;
    }

    main {
      padding: 45px 25px 140px;
      max-width: 800px;
      margin: auto;
    }

    h2 {
      font-size: 50px;
      line-height: 1.05;
      margin-bottom: 20px;
    }

    .subtitle {
      font-size: 20px;
      line-height: 1.5;
      opacity: 0.9;
      margin-bottom: 35px;
    }

    #chat {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      padding: 16px 20px;
      border-radius: 20px;
      max-width: 85%;
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ai {
      background: rgba(255,255,255,0.18);
      align-self: flex-start;
    }

    .user {
      background: white;
      color: #18339e;
      align-self: flex-end;
    }

    .input-area {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px;
      background: rgba(30,70,210,0.95);
      display: flex;
      gap: 12px;
      max-width: 850px;
      margin: auto;
    }

    #question {
      flex: 1;
      padding: 18px;
      border: none;
      border-radius: 20px;
      font-size: 17px;
      outline: none;
    }

    #send {
      padding: 0 28px;
      border: none;
      border-radius: 20px;
      background: white;
      color: #18339e;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #send:disabled {
      opacity: 0.6;
    }

    @media(max-width:600px) {
      h2 {
        font-size: 45px;
      }

      .input-area {
        padding: 12px;
      }

      #send {
        padding: 0 20px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>ULTRON AI</h1>
    <div class="menu">☰</div>
  </header>

  <main>
    <h2>Ask AI<br>Anything.</h2>

    <p class="subtitle">
      Type your question and get a response from your AI assistant.
    </p>

    <div id="chat">
      <div class="message ai">
        Hello! I'm ULTRON AI. Ask me anything.
      </div>
    </div>
  </main>

  <div class="input-area">
    <input
      id="question"
      type="text"
      placeholder="Type your question..."
      autocomplete="off"
    >

    <button id="send">Send</button>
  </div>

  <script src="script.js"></script>

</body>
</html>
