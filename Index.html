<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0a1f8f, #2450ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
      color: #fff;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 92vh;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28);
    }

    .header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .menu {
      font-size: 28px;
    }

    .hero {
      padding: 26px 20px 12px;
    }

    .hero h1 {
      font-size: 34px;
      line-height: 1;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .hero p {
      font-size: 15px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.18);
      border-top-left-radius: 6px;
    }

    .user {
      align-self: flex-end;
      background: #fff;
      color: #1233c8;
      border-top-right-radius: 6px;
    }

    .inputbar {
      padding: 14px;
      background: rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      gap: 10px;
    }

    .inputbar input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
    }

    .inputbar button {
      border: none;
      border-radius: 14px;
      background: #fff;
      color: #1233c8;
      font-weight: 800;
      padding: 14px 18px;
      cursor: pointer;
    }

    .inputbar button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">ULTRON AI</div>
      <div class="menu">☰</div>
    </div>

    <div class="hero">
      <h1>Ask AI<br>Anything.</h1>
      <p>Type your question and get a response from your AI website.</p>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">Hello! Ask me anything.</div>
    </div>

    <div class="inputbar">
      <input id="question" type="text" placeholder="Type your question..." />
      <button onclick="sendQuestion()">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("question");

    async function sendQuestion() {
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "msg user";
      userMsg.textContent = text;
      chat.appendChild(userMsg);

      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      const botMsg = document.createElement("div");
      botMsg.className = "msg bot";
      botMsg.textContent = "Typing...";
      chat.appendChild(botMsg);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: text })
        });

        const data = await res.json();
        botMsg.textContent = data.answer || "No response received.";
      } catch (error) {
        botMsg.textContent = "Server error.";
      }

      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendQuestion();
    });
  </script>
</body>
</html>
