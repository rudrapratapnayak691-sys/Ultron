<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ULTRON AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #111118;
      border-bottom: 1px solid #333;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 3px;
    }

    header p {
      color: #aaa;
      margin-top: 5px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 14px 16px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #333;
    }

    .ai {
      align-self: flex-start;
      background: #181820;
      border: 1px solid #333;
    }

    .typing {
      color: #aaa;
      font-style: italic;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      background: #111118;
      border-top: 1px solid #333;
    }

    #question {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #0b0b0f;
      color: white;
      outline: none;
      font-size: 16px;
    }

    #sendBtn {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: #ffffff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #sendBtn:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <header>
    <h1>⚡ ULTRON AI</h1>
    <p>Your AI Assistant</p>
  </header>

  <div id="chat">
    <div class="message ai">
      Hello! I am ULTRON AI 🤖
      Ask me anything!
    </div>
  </div>

  <div class="input-area">

    <input
      id="question"
      type="text"
      placeholder="Ask ULTRON anything..."
      autocomplete="off"
    >

    <button id="sendBtn" onclick="askAI()">
      Send
    </button>

  </div>

  <script>

    const BACKEND_URL =
      "https://ultron-6c3t.onrender.com/ask";

    const questionInput =
      document.getElementById("question");

    const chat =
      document.getElementById("chat");

    const sendBtn =
      document.getElementById("sendBtn");


    function addMessage(text, type) {

      const message =
        document.createElement("div");

      message.className =
        "message " + type;

      message.textContent =
        text;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;

      return message;
    }


    async function askAI() {

      const question =
        questionInput.value.trim();

      if (!question) {
        return;
      }

      addMessage(question, "user");

      questionInput.value = "";

      sendBtn.disabled = true;

      const typingMessage =
        addMessage("ULTRON is thinking... 🤖", "ai typing");


      try {

        const response =
          await fetch(BACKEND_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              question: question
            })

          });


        const data =
          await response.json();


        typingMessage.remove();


        if (data.answer) {

          addMessage(
            data.answer,
            "ai"
          );

        } else {

          addMessage(
            "Sorry, I couldn't get an answer.",
            "ai"
          );

        }


      } catch (error) {

        console.error(error);

        typingMessage.remove();

        addMessage(
          "⚠️ I couldn't connect to the ULTRON backend. Please try again.",
          "ai"
        );

      }


      sendBtn.disabled = false;

      questionInput.focus();

    }


    questionInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          askAI();

        }

      }
    );

  </script>

</body>
</html>
