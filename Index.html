<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Question Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(180deg, #0b2bd6, #1f4cff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: white;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }

    .header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .menu {
      font-size: 28px;
      cursor: pointer;
    }

    .hero {
      padding: 28px 20px 16px;
    }

    .hero h1 {
      font-size: 34px;
      line-height: 1.05;
      margin-bottom: 12px;
      font-weight: 800;
    }

    .hero p {
      font-size: 15px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .chat {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
    }

    .bot {
      background: rgba(255, 255, 255, 0.18);
      align-self: flex-start;
      border-top-left-radius: 6px;
    }

    .user {
      background: white;
      color: #1430c8;
      align-self: flex-end;
      border-top-right-radius: 6px;
    }

    .input-area {
      padding: 16px;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .input-area input {
      flex: 1;
      border: none;
      outline: none;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 15px;
    }

    .input-area button {
      border: none;
      background: #ffffff;
      color: #1430c8;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .input-area button:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">ULTRON AI</div>
      <div class="menu">☰</div>
    </div>

    <div class="hero">
      <h1>Ask AI<br />Anything.</h1>
      <p>Type your question below and get an instant AI response.</p>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot">Hi! Ask me anything.</div>
    </div>

    <div class="input-area">
      <input type="text" id="questionInput" placeholder="Type your question..." />
      <button onclick="sendQuestion()">Send</button>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("questionInput");

    function sendQuestion() {
      const text = input.value.trim();
      if (!text) return;

      const userMsg = document.createElement("div");
      userMsg.className = "msg user";
      userMsg.textContent = text;
      chat.appendChild(userMsg);

      input.value = "";
      chat.scrollTop = chat.scrollHeight;

      setTimeout(() => {
        const botMsg = document.createElement("div");
        botMsg.className = "msg bot";
        botMsg.textContent = "This is a demo reply. Connect it to your AI backend for real answers.";
        chat.appendChild(botMsg);
        chat.scrollTop = chat.scrollHeight;
      }, 700);
    }

    input.addEventListener("keypress", function (e) {
      if (e.key === "Enter") sendQuestion();
    });
  </script>
</body>
</html>
