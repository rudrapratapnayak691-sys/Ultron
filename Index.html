<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultron AI</title>
  <style>
    :root {
      --bg: #060816;
      --panel: #0f172a;
      --panel-2: #111827;
      --border: #233044;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --user: #2563eb;
      --bot: #1f2937;
      --accent: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #12203a 0%, var(--bg) 45%, #02040a 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 980px;
    }

    .hero {
      text-align: center;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: 0.5px;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .chat {
      height: min(68vh, 760px);
      overflow-y: auto;
      padding: 18px;
      background: linear-gradient(180deg, rgba(17,24,39,0.95), rgba(15,23,42,0.95));
    }

    .msg {
      max-width: min(82%, 760px);
      padding: 12px 14px;
      margin: 10px 0;
      border-radius: 16px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
      border: 1px solid transparent;
    }

    .user {
      margin-left: auto;
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
      color: white;
      border-color: rgba(255,255,255,0.08);
    }

    .bot {
      margin-right: auto;
      background: var(--bot);
      border-color: #334155;
      color: #e2e8f0;
    }

    .system {
      margin: 0 auto;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
      max-width: 100%;
      background: transparent;
      border: none;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px;
      border-top: 1px solid var(--border);
      background: rgba(2, 6, 23, 0.55);
    }

    .composer input {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      outline: none;
    }

    .composer input:focus {
      border-color: #3b82f6;
    }

    .composer button {
      border: none;
      border-radius: 14px;
      padding: 14px 20px;
      background: var(--accent);
      color: #04110a;
      font-weight: 700;
      cursor: pointer;
      min-width: 100px;
    }

    .composer button:hover {
      filter: brightness(0.95);
    }

    .composer button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #cbd5e1;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-5px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <h1>Ultron AI</h1>
      <p>Your custom AI assistant</p>
    </div>

    <div class="card">
      <div id="chat" class="chat">
        <div class="msg bot">Hello. I’m Ultron AI. How can I help you today?</div>
      </div>

      <div class="composer">
        <input id="input" type="text" placeholder="Type your message..." autocomplete="off" />
        <button id="sendBtn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function addMessage(text, className) {
      const div = document.createElement("div");
      div.className = `msg ${className}`;
      div.innerHTML = escapeHtml(text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function addTyping() {
      const div = document.createElement("div");
      div.className = "msg bot";
      div.id = "typing";
      div.innerHTML = `
        <span class="typing">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </span>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, "user");
      input.value = "";
      sendBtn.disabled = true;
      input.disabled = true;

      addTyping();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message })
        });

        const data = await res.json();
        document.getElementById("typing")?.remove();
        addMessage(data.reply || "No reply received.", "bot");
      } catch (error) {
        document.getElementById("typing")?.remove();
        addMessage("Sorry, the AI server is not responding right now.", "bot");
      } finally {
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
